# Dvargosh pre-commit hooks — install once:  pip install pre-commit && pre-commit install
# Run on everything:          pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude_types: [markdown]
      - id: end-of-file-fixer
        exclude_types: [markdown]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: '^build/'

  - repo: local
    hooks:
      - id: clang-format
        name: clang-format (C/C++ formatting)
        entry: clang-format -i --style=file
        language: system
        types_or: [c, c++]
        exclude: '^build/'
      - id: no-build-artifacts
        name: forbid staging build artifacts
        entry: >
          bash -c 'if git diff --cached --name-only | grep -E "^(build/|dist/|.*\.(dylib|so|dSYM))" ; then
          echo "ERROR: build artifacts staged. Unstage them: git restore --staged <file>"; exit 1; fi'
        language: system
        always_run: true
        pass_filenames: false
